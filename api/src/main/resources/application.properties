spring.application.name=api

# Database: defaults match the devcontainer's `db` service; override via env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}

# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI (springdoc): spec at /v3/api-docs, UI at /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
