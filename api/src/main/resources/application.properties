spring.application.name=api

# Database: defaults match the devcontainer's `db` service; override via env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}

# Liquibase owns the schema; Hibernate only validates it.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI (springdoc): spec at /v3/api-docs, UI at /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Security / JWT. The secret has no default on purpose: the app refuses to start without one.
# HS256 needs at least 32 bytes. Supply it via the JWT_SECRET environment variable.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.ttl=PT1H
app.security.jwt.issuer=api

# Argon2id password hashing. Defaults are OWASP's recommended minimum (19 MiB, 2 iterations, 1 lane).
# Changing these only affects new hashes; existing hashes embed their own parameters and still verify.
app.security.argon2.salt-length=${ARGON2_SALT_LENGTH:16}
app.security.argon2.hash-length=${ARGON2_HASH_LENGTH:32}
app.security.argon2.parallelism=${ARGON2_PARALLELISM:1}
app.security.argon2.memory-kib=${ARGON2_MEMORY_KIB:19456}
app.security.argon2.iterations=${ARGON2_ITERATIONS:2}

# Optional dev convenience: create this user at startup if it doesn't exist (blank = disabled).
app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}
