# Podman note: run with `podman compose` / `podman-compose`, rootless.
# `userns_mode: keep-id` maps your host user to uid/gid 1000 (vscode) so the
# bind-mounted workspace is writable.
name: react-java-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    userns_mode: "keep-id:uid=1000,gid=1000"
    # The emulator shares this container's network namespace, so its ports are
    # published here. Bound to host loopback only. From the host see .envrc.
    ports:
      - "127.0.0.1:9297:9297"
      - "127.0.0.1:9298-9317:9298-9317"
      # Vite dev server / preview (`npm run dev`, `npm start` in web/).
      # Vite must listen on 0.0.0.0 for this to work (see web/vite.config.ts).
      - "127.0.0.1:5173:5173"
      # Spring Boot API (`./gradlew bootRun` in api/).
      - "127.0.0.1:8080:8080"
    volumes:
      - ..:/workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-podman-devcontainer}:cached,z
      # Credentials + CA cert written by the emulator, read by the SDKs here.
      # Bind-mounted (not a named volume) so host tools can read the per-run CA
      # at .local/emulator/9297/ca.pem.
      - ../.local/emulator:/home/vscode/.aws/emulator:z
      # Cache of tools installed by mise, so rebuilds don't re-download the JDK etc.
      - mise-data:/home/vscode/.local/share/mise
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy
    # No depends_on for aws-emulator: it joins this container's network
    # namespace (cycle). emulator-trust.sh waits for it on start instead.
    environment:
      # --- Postgres ---
      PGHOST: db
      PGPORT: "5432"
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: app
      DATABASE_URL: postgresql://app:app@db:5432/app
      # No SPRING_DATASOURCE_* here on purpose: env vars outrank properties
      # files and would defeat the API's `test` profile. application.properties
      # already defaults to db:5432/app.
      # API auth (DEV ONLY values; never reuse). The API refuses to start without JWT_SECRET.
      JWT_SECRET: dev-only-jwt-signing-secret-change-me-0123456789abcdef
      APP_BOOTSTRAP_USERNAME: admin
      APP_BOOTSTRAP_PASSWORD: admin-dev-password
      # Throwaway tmpfs Postgres used by the API's `test` Spring profile.
      TEST_DATASOURCE_URL: jdbc:postgresql://db-test:5432/app_test
      # --- AWS Emulator (shares this container's network => 127.0.0.1) ---
      AWS_ENDPOINT_URL: https://127.0.0.1:9297
      AWS_SHARED_CREDENTIALS_FILE: /home/vscode/.aws/emulator/9297/emulator_credentials
      AWS_CONFIG_FILE: /home/vscode/.aws/emulator/9297/config
      AWS_CA_BUNDLE: /home/vscode/.aws/emulator/9297/ca.pem
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DISABLE_HOST_PREFIX_INJECTION: "true"
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      # Merged (JDK defaults + emulator CA) stores built by emulator-trust.sh,
      # so Maven/Gradle downloads keep working alongside the emulator.
      NODE_EXTRA_CA_CERTS: /home/vscode/.aws/emulator/9297/ca.pem
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/home/vscode/.aws/emulator-trust/truststore.p12
        -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=changeit

  db:
    image: docker.io/library/postgres:19
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Second Postgres for tests: data lives in RAM (tmpfs), so it is fast and
  # disposable. Test results are committed (not rolled back) so you can inspect
  # them after a run: PGHOST=db-test PGDATABASE=app_test psql
  # Contents are lost when this container stops.
  # From the host: PGPASSWORD=app psql -h localhost -p 6432 -U app app_test
  db-test:
    image: docker.io/library/postgres:19
    restart: unless-stopped
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - "6432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  aws-emulator:
    build:
      context: ./emulator
    # Join the app container's network namespace: the emulator is then at
    # 127.0.0.1:9297 (required for S3 path-style + the cert's address).
    network_mode: "service:app"
    userns_mode: "keep-id:uid=1000,gid=1000"
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    environment:
      HOME: /home/vscode
      # Must be 0.0.0.0: published ports arrive on the container's non-loopback
      # interface. Host exposure is limited to 127.0.0.1 by `ports` on app.
      EMULATOR_BIND_ADDRESS: 0.0.0.0
      EMULATOR_LISTENER_PORT_RANGE: 9298-9317
      # Telemetry is on by default upstream; off here. Set to "on" to enable.
      EMULATOR_TELEMETRY: off
    command: ["-p", "9297"]
    volumes:
      - ../.local/emulator:/home/vscode/.aws/emulator:z

volumes:
  pgdata:
  mise-data:
